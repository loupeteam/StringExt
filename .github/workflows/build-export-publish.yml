name: Build, Export, and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.16.0)'
        required: true

jobs:
  build-export-publish:
    runs-on: [AS6-runner]

    permissions:
      contents: read
      packages: write

    env:
      PROJECT:     example/As6Project/AsProject.apj
      PROJECT_DIR: example/As6Project
      LIBRARY:     StringExt
      LIBRARY_DIR: src/Ar/StringExt
      EXPORT_DIR:  export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@loupeteam'

      # Resolve version from tag (push trigger) or manual input
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $ver = "${{ inputs.version }}" -replace '^v', ''
          }
          if (-not $ver) {
            Write-Error "Could not determine version. Push a v*.*.* tag or supply the version input."
            exit 1
          }
          Write-Host "Publishing version: $ver"
          "version=$ver" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT

      - name: Find AS6 build executable
        uses: loupeteam/br-actions/find-as6-build@v1
        id: find-as

      - name: Build Intel
        uses: loupeteam/br-actions/build-as-project@v1
        with:
          exe-path: ${{ steps.find-as.outputs.exe-path }}
          project:  ${{ env.PROJECT }}
          config:   Intel

      - name: Build ARM
        uses: loupeteam/br-actions/build-as-project@v1
        with:
          exe-path: ${{ steps.find-as.outputs.exe-path }}
          project:  ${{ env.PROJECT }}
          config:   ARM

      - name: Export library
        uses: loupeteam/br-actions/export-as-library@v1
        with:
          project-dir: ${{ env.PROJECT_DIR }}
          library:     ${{ env.LIBRARY }}
          library-dir: ${{ env.LIBRARY_DIR }}
          configs:     Intel ARM
          output:      ${{ env.EXPORT_DIR }}
          as-install:  ${{ steps.find-as.outputs.install-path }}

      # Inject the release version into package.json and publish
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Locate the exported version directory (e.g. export/StringExt/V0.16.0/)
          $versionDir = Get-ChildItem "$env:EXPORT_DIR/$env:LIBRARY" -Directory |
                        Select-Object -First 1 -ExpandProperty FullName

          # Read the package.json template from source, update version, write to export
          $pkg = Get-Content "$env:LIBRARY_DIR/package.json" | ConvertFrom-Json
          $pkg.version = "${{ steps.version.outputs.version }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $versionDir "package.json")

          Write-Host "Publishing @loupeteam/$($env:LIBRARY.ToLower())@${{ steps.version.outputs.version }}"
          Push-Location $versionDir
          npm publish
          Pop-Location

      - name: Upload exported library artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LIBRARY }}-${{ steps.version.outputs.version }}
          path: ${{ env.EXPORT_DIR }}/${{ env.LIBRARY }}/
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildDiagnostics
          path: example/As6Project/Temp/BuildDiagnostics.log
          if-no-files-found: ignore

name: Build

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: 'Build mode'
        required: false
        default: 'Build'
        type: choice
        options:
          - Build
          - Rebuild
  # Build on PRs targeting any branch.
  #
  # SECURITY NOTE: this uses the standard `pull_request` trigger, which checks
  # out the PR head but runs with read-only token and no access to secrets when
  # the PR comes from a fork. Combined with the repo setting
  #   Settings → Actions → General →
  #   "Require approval for all outside collaborators"
  # (or "Require approval for first-time contributors"), this means workflows
  # from external contributors will not run on a self-hosted runner until a
  # maintainer reviews the PR and clicks "Approve and run".
  # Do NOT switch this to `pull_request_target` — that runs in the context of
  # the base branch with full permissions and would expose the runner.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    runs-on: [AS6-runner]

    env:
      PROJECT: example/As6Project/AsProject.apj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Find AS6 build executable
        uses: loupeteam/br-actions/find-as6-build@v1
        id: find-as

      - name: Build Intel
        uses: loupeteam/br-actions/build-as-project@v1
        with:
          exe-path:   ${{ steps.find-as.outputs.exe-path }}
          project:    ${{ env.PROJECT }}
          config:     Intel
          build-mode: ${{ inputs.build-mode }}

      - name: Build ARM
        uses: loupeteam/br-actions/build-as-project@v1
        with:
          exe-path:   ${{ steps.find-as.outputs.exe-path }}
          project:    ${{ env.PROJECT }}
          config:     ARM
          build-mode: ${{ inputs.build-mode }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildDiagnostics
          path: example/As6Project/Temp/BuildDiagnostics.log
          if-no-files-found: ignore

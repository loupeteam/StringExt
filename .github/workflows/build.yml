name: Build

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: 'Build mode'
        required: false
        default: 'Build'
        type: choice
        options:
          - Build
          - Rebuild

jobs:
  build:
    runs-on: [AS6-runner]

    env:
      PROJECT: example/As6Project/AsProject.apj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Find AS6 build executable
        uses: loupeteam/br-actions/find-as6-build@v1
        id: find-as

      - name: Build Intel
        uses: loupeteam/br-actions/build-as-project@v1
        with:
          exe-path:   ${{ steps.find-as.outputs.exe-path }}
          project:    ${{ env.PROJECT }}
          config:     Intel
          build-mode: ${{ inputs.build-mode }}

      - name: Build ARM
        uses: loupeteam/br-actions/build-as-project@v1
        with:
          exe-path:   ${{ steps.find-as.outputs.exe-path }}
          project:    ${{ env.PROJECT }}
          config:     ARM
          build-mode: ${{ inputs.build-mode }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildDiagnostics
          path: example/As6Project/Temp/BuildDiagnostics.log
          if-no-files-found: ignore
